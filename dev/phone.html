<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone preview (dev)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #1d1f24;
    color: #e8e8e8;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; background: #26292f; border-bottom: 1px solid #33363d;
  }
  .bar select, .bar button, .bar a {
    font: inherit; color: #e8e8e8; background: #33363d; border: 1px solid #44474f;
    border-radius: 7px; padding: 6px 10px; cursor: pointer; text-decoration: none;
  }
  .bar button:hover, .bar a:hover, .bar select:hover { border-color: #ff7a1a; }
  .path { font-family: ui-monospace, Menlo, monospace; color: #aaa; }
  .spacer { flex: 1; }
  .count { background: #ff7a1a; color: #fff; border-radius: 999px; padding: 3px 10px; font-weight: 600; display: none; }
  .count.show { display: inline-block; }
  .hint { color: #888; }
  .stage { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 20px; overflow: hidden; }
  .device {
    transform-origin: top center;
    background: #0b0c0e;
    border-radius: 46px;
    padding: 14px;
    box-shadow: 0 0 0 2px #3a3d44, 0 25px 60px rgba(0,0,0,.55);
    position: relative;
  }
  .device.tablet { border-radius: 30px; padding: 22px; }
  .device iframe { display: block; border: 0; border-radius: 32px; background: #fff; }
  .device.tablet iframe { border-radius: 10px; }
  .size { color: #888; text-align: center; margin-top: 8px; font-size: 12px; }
</style>
</head>
<body>
  <div class="bar">
    <strong>📱 Phone preview</strong>
    <select id="device" aria-label="Device">
      <option value="375x667">iPhone SE (375×667)</option>
      <option value="390x844" selected>iPhone 15 (390×844)</option>
      <option value="430x932">iPhone 15 Pro Max (430×932)</option>
      <option value="360x780">Galaxy S23 (360×780)</option>
      <option value="412x915">Pixel 8 (412×915)</option>
      <option value="768x1024">iPad mini (768×1024)</option>
    </select>
    <button id="rotate" type="button" title="Rotate">⟳ Rotate</button>
    <span class="path" id="path"></span>
    <span class="spacer"></span>
    <span class="hint">Ctrl+click inside the phone to comment</span>
    <span class="count" id="count"></span>
    <a id="desktop" href="/">🖥 Desktop view</a>
  </div>
  <div class="stage" id="stage">
    <div>
      <div class="device" id="frame"><iframe id="screen" title="Site preview"></iframe></div>
      <div class="size" id="size"></div>
    </div>
  </div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var startPath = params.get('path') || '/';
  if (startPath.charAt(0) !== '/' || startPath.indexOf('//') === 0) startPath = '/';
  var deviceSel = document.getElementById('device');
  var frame = document.getElementById('frame');
  var screen = document.getElementById('screen');
  var landscape = false;

  try {
    var saved = localStorage.getItem('__phone_device');
    if (saved && deviceSel.querySelector('option[value="' + saved + '"]')) deviceSel.value = saved;
  } catch (e) {}

  function layout() {
    var wh = deviceSel.value.split('x').map(Number);
    var w = landscape ? wh[1] : wh[0], h = landscape ? wh[0] : wh[1];
    screen.style.width = w + 'px';
    screen.style.height = h + 'px';
    frame.classList.toggle('tablet', wh[0] >= 600);
    var pad = wh[0] >= 600 ? 44 : 28;
    var stage = document.getElementById('stage');
    var avail = stage.clientHeight - 60, availW = stage.clientWidth - 40;
    var scale = Math.min(1, avail / (h + pad), availW / (w + pad));
    frame.style.transform = 'scale(' + scale + ')';
    frame.parentNode.style.height = ((h + pad) * scale + 30) + 'px';
    document.getElementById('size').textContent = w + ' × ' + h + (scale < 1 ? '  (shown at ' + Math.round(scale * 100) + '%)' : '');
  }

  deviceSel.addEventListener('change', function () {
    try { localStorage.setItem('__phone_device', deviceSel.value); } catch (e) {}
    layout();
  });
  document.getElementById('rotate').addEventListener('click', function () { landscape = !landscape; layout(); });
  window.addEventListener('resize', layout);

  // Keep the address bar and "Desktop view" link in sync with the page shown in the phone
  screen.addEventListener('load', function () {
    var p;
    try { p = screen.contentWindow.location.pathname + screen.contentWindow.location.hash; } catch (e) { return; }
    document.getElementById('path').textContent = p;
    document.getElementById('desktop').href = p;
    history.replaceState(null, '', '/__dev/phone?path=' + encodeURIComponent(p));
  });

  // Comment counter (the in-phone counter is hidden to keep the small screen clear)
  function refresh() {
    fetch('/__dev/comments', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (list) {
      var el = document.getElementById('count');
      el.textContent = list.length + (list.length === 1 ? ' comment' : ' comments');
      el.classList.toggle('show', list.length > 0);
    }).catch(function () {});
  }

  screen.src = startPath;
  layout();
  refresh();
  setInterval(refresh, 1500);
})();
</script>
</body>
</html>
